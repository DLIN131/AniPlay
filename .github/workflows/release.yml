name: Build & Release

on:
  push:
    branches: [main]
    # 只改說明文件不用發新版（不然 App 會跳出沒有內容的更新）
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks

      - name: Build release APKs
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          SIGNING_STORE_FILE: keystore/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :phone:assembleRelease :tv:assembleRelease --no-daemon
          mkdir -p ../out
          cp phone/build/outputs/apk/release/phone-release.apk ../out/AniPlay.apk
          cp tv/build/outputs/apk/release/tv-release.apk ../out/AniPlayTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/

  desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Build Windows app
        shell: pwsh
        run: |
          # 版本號寫進 App，給內建的更新檢查用
          "window.APP_VERSION = ${{ github.run_number }}" | Set-Content -Encoding utf8 src/version.js
          npm ci --no-audit --no-fund
          npm version "1.0.${{ github.run_number }}" --no-git-tag-version
          # 排除規則寫在 pack.js（命令列的 ^ 會被 cmd.exe 吃掉，連 hls.js/dist 都被排除）
          $env:APP_VERSION = "1.0.${{ github.run_number }}"
          node pack.js dist
          New-Item -ItemType Directory -Force ../out | Out-Null
          Compress-Archive -Path dist/AniPlay-win32-x64/* -DestinationPath ../out/AniPlay-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: out/

  release:
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AniPlay v1.0.${{ github.run_number }}
          make_latest: true
          files: |
            out/AniPlay.apk
            out/AniPlayTV.apk
            out/AniPlay-Windows.zip
          # 更新說明就是 commit 訊息
          body: |
            ${{ github.event.head_commit.message }}

            ---
            固定下載網址（永遠是最新版）：
            手機版：https://github.com/${{ github.repository }}/releases/latest/download/AniPlay.apk
            電視版：https://github.com/${{ github.repository }}/releases/latest/download/AniPlayTV.apk
            Windows 版：https://github.com/${{ github.repository }}/releases/latest/download/AniPlay-Windows.zip
